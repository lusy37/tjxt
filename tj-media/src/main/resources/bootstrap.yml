server:
  port: 8084  #端口
  tomcat:
    uri-encoding: UTF-8   #服务编码
spring:
  profiles:
    active: dev
  application:
    name: media-service
  cloud:
    nacos:
      config:
        file-extension: yaml
        shared-configs: # 共享配置
          - data-id: shared-spring.yaml # 共享spring配置
            refresh: false
          - data-id: shared-redis.yaml # 共享redis配置
            refresh: false
          - data-id: shared-logs.yaml # 共享日志配置
            refresh: false
          - data-id: shared-mybatis.yaml # 共享mybatis配置
            refresh: false
          - data-id: shared-feign.yaml # 共享feign配置
            refresh: false
tj:
  swagger:
    enable: true
    package-path: com.tianji.media.controller
    title: 天机学堂 - 媒资中心接口文档
    description: 该服务包含图片管理、媒资管理等
    contact-name: 传智教育·研究院
    contact-url: http://www.itcast.cn/
    contact-email: zhanghuyi@itcast.cn
    version: v1.0
    enableResponseWrap: true
  auth:
    resource:
      enable: true
      excludeLoginPaths:
        - /medias/signature/play
  jdbc:
    database: tj_media
  platform:
    file: TENCENT
    media: TENCENT
  tencent:
    appId: ${TENCENT_APP_ID}  # 环境变量：TENCENT_APP_ID
    secretId: ${TENCENT_SECRET_ID}  # 环境变量：TENCENT_SECRET_ID
    secretKey: ${TENCENT_SECRET_KEY}  # 环境变量：TENCENT_SECRET_KEY
    vod:
      enable: true
      vodValidSeconds: 7776000
      region: ${TENCENT_VOD_REGION}  # 环境变量：TENCENT_VOD_REGION
      procedure: ${TENCENT_VOD_PROCEDURE}  # 环境变量：TENCENT_VOD_PROCEDURE
      urlKey: ${TENCENT_VOD_URL_KEY}  # 环境变量：TENCENT_VOD_URL_KEY
      pfcg: ${TENCENT_VOD_PFCG}  # 环境变量：TENCENT_VOD_PFCG
    cos:
      enable: true
      region: ${TENCENT_COS_REGION}  # 环境变量：TENCENT_COS_REGION
      bucket: ${TENCENT_COS_BUCKET}  # 环境变量：TENCENT_COS_BUCKET
      multipartUploadThreshold: 5242880 # 5mb，触发分片上传的阈值
      minimumUploadPartSize: 1048576 # 1mb，分片的最小大小
